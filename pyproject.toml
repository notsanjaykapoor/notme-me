[project]
name = "notme-me"
version = "0.1.0"
description = "just me"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.7",
    "fastapi>=0.115.0",
    "jinja2>=3.1.4",
    "python-dotenv>=1.0.1",
    "ruff>=0.7.1",
    "ulid-py>=1.1.0",
    "uvicorn>=0.30.6",
]

[tool.ruff]
# Enable Pyflakes `E` and `F` codes by default.
lint.select = ["E", "F"]
lint.ignore = ["E402"]

indent-width = 4
line-length = 88

[tool.ruff.lint.isort]
force-sort-within-sections = true
order-by-type = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]
